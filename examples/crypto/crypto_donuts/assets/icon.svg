<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182842"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
    <linearGradient id="glaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0637F"/>
      <stop offset="1" stop-color="#C93357"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)" stroke="#3B6EA5" stroke-width="2"/>

  <!-- torus-knot cord, looping through the donut hole -->
  <path d="M 30 78 C 40 52, 88 52, 98 78 C 90 68, 76 92, 64 78 C 52 64, 38 88, 30 78 Z"
        fill="none" stroke="#2A9D8F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- donut body: ring drawn with evenodd fill -->
  <path fill-rule="evenodd"
        d="M 64 34 C 84.9 34 100 48.7 100 68 C 100 87.3 84.9 100 64 100
           C 43.1 100 28 87.3 28 68 C 28 48.7 43.1 34 64 34 Z
           M 64 55 C 73.4 55 79 60.8 79 68 C 79 75.2 73.4 81 64 81
           C 54.6 81 49 75.2 49 68 C 49 60.8 54.6 55 64 55 Z"
        fill="url(#glaze)" stroke="#8A1F3B" stroke-width="1.5"/>

  <!-- glaze highlight -->
  <path d="M 40 52 C 46 42, 58 37, 68 37" fill="none" stroke="#FFB8C6" stroke-width="4"
        stroke-linecap="round" opacity="0.55"/>

  <!-- sprinkles -->
  <rect x="46" y="41" width="10" height="3.5" rx="1.7" fill="#7FB069" transform="rotate(25 51 42.7)"/>
  <rect x="70" y="43" width="10" height="3.5" rx="1.7" fill="#8D99AE" transform="rotate(-20 75 44.7)"/>
  <rect x="34" y="63" width="10" height="3.5" rx="1.7" fill="#3B6EA5" transform="rotate(70 39 64.7)"/>
  <rect x="84" y="60" width="10" height="3.5" rx="1.7" fill="#7FB069" transform="rotate(-60 89 61.7)"/>
  <rect x="58" y="90" width="10" height="3.5" rx="1.7" fill="#8D99AE" transform="rotate(15 63 91.7)"/>
</svg>
