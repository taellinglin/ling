[package]
name = "ling-lang"
version = "2030.1.20"
edition = "2021"
description = "Ling - The Omniglot Systems Language"
authors = [
    "Ling Lin <taellinglin@gmail.com>",
    "Sanny Lin <SannyLing53@gmail.com>"
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taellinglin/ling"
homepage = "https://ling-lang.org"
documentation = "https://docs.ling-lang.org"
readme = "README.md"
keywords = ["systems", "polyglot", "ai", "crypto", "game"]
categories = ["compilers", "graphics", "game-development", "artificial-intelligence", "cryptography"]
rust-version = "1.85"
# Keep the published crate small (crates.io 10 MB limit): ship only source.
# These dirs aren't needed to compile the library/binaries (verified: nothing
# embeds them via include_str!/include_bytes!).
exclude = [
    "assets/", "examples/", "docs/", "instruments/", "lexicons/",
    "chinese-room-web/", "dist/", "recordings/", "cache/", "*.svg",
]

[workspace]
members = [
    "crates/ling-core",
    "crates/ling-lex",
    "crates/ling-polyglot",
    "crates/ling-ai",
    "crates/ling-icon",
    "crates/ling-crypto",
    "crates/ling-audio",
    "crates/ling-net",
    "crates/ling-mir",
    "crates/ling-fu",
    "crates/ling-graphics",
    "crates/ling-wasm",
    "crates/ling-ast",
    "crates/ling-codegen",
    "crates/ling-runtime",
    "crates/ling-ui",
    "crates/ling-game",
    "crates/ling-macro",
    "crates/ling-mic",
    "crates/ling-physics",
    "crates/ling-py",
    "crates/ling-music",

]
exclude = [
    # Build artifacts
    "examples/.ling-build",
    "examples/.ling-build/**",
    "examples/music/.ling-build/hallway_runner",
    "examples/music/.ling-build/karaoke_hero",
    ".ling-shared-target",
    ".ling-shared-target/**",
    # Pre-built binaries
    "dist",
    "dist/**",
    "examples/sakohn",
    "examples/sakohn/**",
    "examples/crypto",
    "examples/crypto/**",
    "examples/physics",
    "examples/physics/**",
    # Generated / large output files
    "examples/*_map.svg",
    "examples/tools/ling_map.ling",
    # Editor / tooling
    ".claude",
    ".claude/**",
    ".vscode",
    ".idea",
    # Web demo (separate repo concern)
    "chinese-room-web",
    "chinese-room-web/**",
    # Docs build output (large fonts/woff2, rebuilt by CI)
    "docs/book",
    "docs/book/**",
    
]

# Make `cargo run` build Ling itself (not lingfu) by default.
# You can still run Lingfu with: cargo run -p lingfu --bin lingfu
default-run = "ling"

[lib]
name = "ling"
path = "src/lib.rs"

[[bin]]
name = "ling"
path = "src/main.rs"

[[bin]]
name = "lingc"
path = "src/bin/lingc.rs"

[[bin]]
name = "lx"
path = "src/bin/lx.rs"

[[bin]]
name = "ling-repl"
path = "src/bin/ling-repl.rs"

[features]
# Enable LLVM-backed native codegen (requires LLVM toolchain)
llvm = []

[dependencies]
glam = "0.28"
base64 = "0.22"
flate2 = "1"
ling-physics = { path = "crates/ling-physics", version = "2030.1", features = ["with-gltf"] }
ling-graphics = { path = "crates/ling-graphics", version = "2030.0.1" }
ling-game = { path = "crates/ling-game", version = "2030.1" }
ling-mir = { workspace = true }
ling-ast = { workspace = true }
ling-core = { workspace = true }
ling-codegen = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.27"
ling-ai = { path = "crates/ling-ai", version = "2030.0.0" }
ling-icon = { path = "crates/ling-icon", version = "2030.0.0" }
ling-audio = { path = "crates/ling-audio", version = "2030.0.1" }
ling-music = { path = "crates/ling-music", version = "2030.0.0" }
ling-mic = { path = "crates/ling-mic", version = "2030.0.1" }
ling-crypto = { path = "crates/ling-crypto", version = "2030.1.3" }
ling-ui = { path = "crates/ling-ui", version = "2030.0.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    # Console
    "console",
    # Graphics
    "OffscreenCanvas",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlUniformLocation",
    # Web Audio API
    "AudioContext",
    "AudioContextOptions",
    "AudioDestinationNode",
    "AudioListener",
    "AudioNode",
    "AudioParam",
    "BaseAudioContext",
    "GainNode",
    "OscillatorNode",
    "OscillatorType",
    "PannerNode",
    "PanningModelType",
    "DistanceModelType",
] }

[build-dependencies]


# Needed by build.rs for generating parser grammar via lalrpop
lalrpop = "0.22"

# Embeds assets/ling.ico into ling.exe / lingc.exe / lx.exe / ling-repl.exe.
winresource = "0.1"



[workspace.dependencies]
# Core
ling-core     = { path = "crates/ling-core",     version = "2030.0.0" }
ling-lex      = { path = "crates/ling-lex",      version = "2030.0.0" }
ling-ast      = { path = "crates/ling-ast",      version = "2030.0.0" }
ling-mir      = { path = "crates/ling-mir",      version = "2030.0.0" }
ling-codegen  = { path = "crates/ling-codegen",  version = "2030.0.0" }
ling-runtime  = { path = "crates/ling-runtime",  version = "2030.0.0" }
ling-polyglot = { path = "crates/ling-polyglot", version = "2030.0.0" }
ling-macro    = { path = "crates/ling-macro",    version = "2030.0.0" }

# Graphics & Game
ling-graphics = { path = "crates/ling-graphics", version = "2030.0.0" }
ling-ui       = { path = "crates/ling-ui",       version = "2030.0.0" }
ling-game     = { path = "crates/ling-game",     version = "2030.0.0" }

# AI
ling-ai = { path = "crates/ling-ai", version = "2030.0.0" }

# Crypto
ling-crypto   = { path = "crates/ling-crypto",   version = "2030.0.0" }
aes-gcm       = "0.10"
curve25519-dalek = "4.1"
blake3        = "1.5"

# Audio
ling-audio = { path = "crates/ling-audio", version = "2030.0.0" }
ling-music = { path = "crates/ling-music", version = "2030.0.0" }
ling-mic   = { path = "crates/ling-mic",   version = "2030.0.0" }
cpal       = "0.15"
hound      = "3.5"
half       = "2"

# Networking
ling-net = { path = "crates/ling-net", version = "2030.0.0" }
tokio    = { version = "1.37", features = ["full"] }
quinn    = "0.11"

# WASM interop (used by reqwest/mistralrs + wgpu)
web-sys = "0.3.74"




js-sys = "0.3.72"
wasm-bindgen = "0.2.95"


# Physics & math
ling-physics = { path = "crates/ling-physics", version = "2030.0.0" }
glam         = "0.28"

# Shared
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
rayon = "1.9"
async-trait = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1
debug = true

[package.metadata.docs.rs]
# "llvm" feature requires the LLVM toolchain and is not suitable for docs.rs.
# Build with no extra features so the base public API is documented.
rustdoc-args = ["--cfg", "docsrs"]

