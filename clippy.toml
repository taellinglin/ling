# Clippy configuration — only real clippy.toml keys belong here.
# Lint *levels* (warn/deny for clippy::all, pedantic, correctness, the rustc
# `warnings`/`rust_2018_idioms`/`future_incompatible` groups, …) are NOT valid
# clippy.toml fields — clippy errors with "unknown field" on them. Configure
# those via a `[lints.clippy]` / `[lints.rust]` table in Cargo.toml (or via
# RUSTFLAGS) instead.

disallowed-types = []
disallowed-macros = []
disallowed-methods = []

avoid-breaking-exported-api = false
