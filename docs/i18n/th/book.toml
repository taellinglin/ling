# Generated layout: English at /docs/, translations at /docs/<lang>/ with the
# same page paths. Build all five with:  python docs/tools/build.py
[book]
title = "เอกสาร Ling"
description = "ภาษาระบบหลายภาษา: เขียนด้วยภาษาอังกฤษ จีน ญี่ปุ่น เกาหลี หรือไทย แล้วรันได้ทุกที่"
authors = ["Ling Lin", "Sanny Lin"]
language = "th"
src = "src"

[build]
build-dir = "../../book/th"

[output.html]
site-url = "/docs/th/"
git-repository-url = "https://github.com/taellinglin/ling"
edit-url-template = "https://github.com/taellinglin/ling/edit/master/docs/i18n/th/src/{path}"
additional-css = ["custom.css"]
additional-js = ["lang.js"]
no-section-label = false

[output.html.playground]
editable = false

[output.html.search]
enable = true
