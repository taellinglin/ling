[package]
name = "ling-physics"
version = "2030.1.11"
edition = "2021"
authors = ["Ling Lin <taellinglin@gmail.com>", "Sanny Lin <SannyLing53@gmail.com>"]
description = "Physics, world generation, and hyperbolic geometry for Ling"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taellinglin/ling"

[features]
default = []
with-gltf = ["dep:gltf"]
# Enable the CUDA fast-path for batched ops (N-body, etc.); CPU fallback otherwise.
cuda = ["ling-gpu/cuda"]

[dependencies]
glam = "0.33"
gltf = { version = "1.4", optional = true }
ling-gpu = { path = "../ling-gpu", version = "2030.0.4" }
rayon = "1.10"

[lib]
name = "ling_physics"
path = "src/lib.rs"
