[package]
name = "ling-physics"
version = "2030.1.0"
edition = "2021"
authors = ["Ling Lin <taellinglin@gmail.com>", "Sanny Lin <SannyLing53@gmail.com>"]
description = "Physics, world generation, and hyperbolic geometry for Ling"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taellinglin/ling"

[features]
default = []
with-gltf = ["dep:gltf"]

[dependencies]
glam = "0.28"
gltf = { version = "1.4", optional = true }

[lib]
name = "ling_physics"
path = "src/lib.rs"
