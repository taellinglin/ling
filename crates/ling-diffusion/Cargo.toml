[package]
name = "ling-diffusion"
version = "2030.0.1"
edition = "2021"
authors = ["Ling Lin <taellinglin@gmail.com>"]
description = "In-process Stable Diffusion (SD 1.x / SDXL) for Ling: loads single-file AUTOMATIC1111-style checkpoints (.safetensors / .ckpt), CLIP prompt weighting, k-diffusion samplers, txt2img / img2img, PNGs with A1111 'parameters' text. Backs the sd_* builtins and LingDiffusion."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taellinglin/ling"

[features]
default = []
# candle's CUDA backend (same kernels ling-ai's llm-cuda uses)
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
serde_json = "1.0"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
rand = "0.8"
libloading = "0.8"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[lib]
name = "ling_diffusion"
path = "src/lib.rs"

# built on its own while developing; the ling workspace lists it as a member too

[dev-dependencies]
anyhow = "1"
