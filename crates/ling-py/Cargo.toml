[package]
name = "ling-py"
version = "2030.0.0"
edition = "2021"
authors = ["Ling Lin <taellinglin@gmail.com>", "Sanny Lin <SannyLing53@gmail.com>"]
description = "Python bindings for ling-audio, ling-physics, and ling-net"
license = "Apache-2.0 OR MIT"

[lib]
name = "ling_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
ling-audio   = { path = "../ling-audio",   version = "2030.0.0" }
ling-physics = { path = "../ling-physics", version = "2030.0.0" }
glam         = "0.28"

# Async WebSocket for netplay
tokio             = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
tokio-tungstenite = { version = "0.21" }
futures-util      = "0.3"
