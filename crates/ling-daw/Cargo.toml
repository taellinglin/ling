[package]
name = "ling-daw"
version = "2030.0.1"
edition = "2021"
authors = ["Ling Lin <taellinglin@gmail.com>", "Sanny Lin <SannyLing53@gmail.com>"]
description = "Ling DAW engine: synth, physical-modeling drums, effects, mixer, sequencer, project I/O"
license = "Apache-2.0 OR MIT"

[dependencies]
ling-music = { workspace = true }
cpal = "0.15"
ling-mic = { workspace = true }
hound = "3.5"
# the Sheet tab draws the score pages (SVG) to a bitmap in-process
resvg = "0.44"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
midir = "0.8"
midly = "0.5"
pinyin = "0.11"
rayon = { workspace = true }
arboard = "3"
flacenc = "0.5.1"
vorbis-encoder = "0.1"

[features]
# set by the `ling` binary's own `llm` feature: the language-model builtins exist, so the DAW offers AI instrumentation
llm = ["dep:ling-ai", "ling-ai/llm"]

[dependencies.ling-ai]
# the native RVC voice conversion (Voice Skin without Python) and other candle models; only with the `llm` feature
path = "../ling-ai"
optional = true

[lib]
name = "ling_daw"
path = "src/lib.rs"

[dev-dependencies]
claxon = "0.4"
