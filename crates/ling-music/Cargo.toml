[package]
name = "ling-music"
version = "2030.0.6"
edition = "2021"
authors = ["Ling Lin <taellinglin@gmail.com>", "Sanny Lin <SannyLing53@gmail.com>"]
description = "2030-ready music toolkit for Ling — decode, BPM/key analysis, GM-capable synthesis, rhythm-game & karaoke tools"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/taellinglin/ling"

[dependencies]
rustfft = "6.2"
cpal    = "0.15"
midly   = "0.5"
symphonia = { version = "0.5", default-features = false, features = [
    "wav", "pcm", "flac", "ogg", "vorbis", "mp3", "isomp4", "aac",
] }

[lib]
name = "ling_music"
path = "src/lib.rs"
