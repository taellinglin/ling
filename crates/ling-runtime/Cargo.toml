[package]
name = "ling-runtime"
version = "2030.0.2"
edition = "2021"
authors = ["Ling Lin <taellinglin@gmail.com>", "Sanny Lin <SannyLing53@gmail.com>"]
description = "Ling language runtime — GC, allocator, and standard library"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taellinglin/ling"

[features]
default = []
# Use mimalloc as the global allocator
mimalloc = ["dep:mimalloc"]

[dependencies]
ling-core = { workspace = true }
mimalloc  = { version = "0.1", optional = true }

[lib]
name = "ling_runtime"
path = "src/lib.rs"
