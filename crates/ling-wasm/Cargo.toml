[package]
name = "ling-wasm"
version = "2030.0.8"
edition = "2021"
description = "Ling language — WebGL2 WASM runtime"

[lib]
crate-type = ["cdylib"]

[dependencies]
ling = { path = "../..", package = "ling-lang" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["OffscreenCanvas", "console"] }
console_error_panic_hook = "0.1"
