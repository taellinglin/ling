[package]
name = "ling-wasm"
version = "2030.0.10"
edition = "2021"
description = "Ling language — WebGL2 WASM runtime"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taellinglin/ling"

[lib]
crate-type = ["cdylib"]

[dependencies]
ling = { path = "../..", package = "ling-lang", version = "2030.1.41" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["OffscreenCanvas", "console", "DedicatedWorkerGlobalScope", "ImageBitmap"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
