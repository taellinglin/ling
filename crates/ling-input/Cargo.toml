[package]
name = "ling-input"
version = "2030.0.1"
edition = "2021"
authors = ["Ling Lin <taellinglin@gmail.com>", "Sanny Lin <SannyLing53@gmail.com>"]
description = "Sensorium — Ling's unified input system: gamepads, joysticks, haptics, motion, XR controllers, and themeable on-screen touch controls (灵 organic ↔ 机 mechanical)"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taellinglin/ling"

[features]
default = ["serde"]
# Serialize themes, control layouts, action maps, and input snapshots
# (for replays / rollback netcode). Pulls glam's serde impls too.
serde = ["dep:serde", "glam/serde"]
# Native gamepad + rumble backend via gilrs (XInput / DInput / evdev / HID).
gilrs = ["dep:gilrs"]

[dependencies]
glam = "0.33"
serde = { version = "1.0", features = ["derive"], optional = true }
gilrs = { version = "0.11", optional = true }

[lib]
name = "ling_input"
path = "src/lib.rs"
