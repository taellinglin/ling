[package]
name = "lingfu"
version = "2030.1.9"
edition = "2024"
authors = ["Ling Lin <taellinglin@gmail.com>", "Sanny Lin <SannyLing53@gmail.com>"]
description = "灵符 — The Ling project manager. lingfu new/build/run/normalize and more."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taellinglin/ling"
homepage = "https://ling-lang.org"
documentation = "https://docs.ling-lang.org"
keywords = ["ling", "polyglot", "multilingual", "build-tool", "package-manager"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "lingfu"
path = "src/lib.rs"

[[bin]]
name = "lingfu"
path = "src/main.rs"

[[bin]]
name = "灵符"
path = "src/bin/灵符.rs"

[[bin]]
name = "霊符"
path = "src/bin/霊符.rs"

[[bin]]
name = "영부"
path = "src/bin/영부.rs"

[[bin]]
name = "линфу"
path = "src/bin/линфу.rs"

[[bin]]
name = "لينغفو"
path = "src/bin/لينغفو.rs"

[[bin]]
name = "लिंगफू"
path = "src/bin/लिंगफू.rs"

[[bin]]
name = "ลิงฟู"
path = "src/bin/ลิงฟู.rs"

[[bin]]
name = "lingfu-de"
path = "src/bin/lingfu-de.rs"

[[bin]]
name = "lingfu-fr"
path = "src/bin/lingfu-fr.rs"

[[bin]]
name = "lingfu-es"
path = "src/bin/lingfu-es.rs"

[[bin]]
name = "linhphu"
path = "src/bin/linhphu.rs"

[[bin]]
name = "λινγφυ"
path = "src/bin/λινγφυ.rs"

[[bin]]
name = "לינגפו"
path = "src/bin/לינגפו.rs"

[[bin]]
name = "lingfu-tr"
path = "src/bin/lingfu-tr.rs"

[[bin]]
name = "lingfu-pl"
path = "src/bin/lingfu-pl.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
clap = { version = "4.4", features = ["derive", "color"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
dialoguer = "0.11"
colored = "2.0"
walkdir = "2.4"
git2 = "0.18"
tempfile = "3.8"
rayon = "1.10"
unicode-normalization = "0.1"
unicode-script = "0.5"
# Registry client: `lingfu publish/login/logout` talk to fu.ling-lang.org.
# ureq defaults to a pure-rustls TLS stack (no OpenSSL), so this builds on
# Windows without a system TLS toolchain.
ureq = { version = "2", features = ["json"] }
flate2 = "1"
tar = "0.4"
base64 = "0.22"
dirs = "5"
# `lingfu seed`'s keyfile HKDF, AEAD, and Shamir-recovery shares.
ling-crypto = { path = "../ling-crypto", version = "2030.1.4" }
