[package]
name = "ling-net"
version = "2030.0.0"
edition = "2021"
authors = ["Ling Lin <taellinglin@gmail.com>", "Sanny Lin <SannyLing53@gmail.com>"]
description = "Async networking — HTTP, WebSocket, QUIC, and peer-to-peer"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taellinglin/ling"

[features]
default = ["http"]
http      = ["dep:axum", "dep:reqwest", "dep:tokio"]
websocket = ["dep:tokio-tungstenite", "dep:tokio"]
quic      = ["dep:quinn", "dep:tokio"]
grpc      = ["dep:tonic", "dep:prost", "dep:tokio"]

[dependencies]
ling-core   = { workspace = true }
ling-crypto = { workspace = true }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
anyhow      = "1.0"
thiserror   = "1.0"

tokio             = { version = "1.37", features = ["rt", "net", "io-util", "macros"], optional = true }
axum              = { version = "0.7", optional = true }
reqwest           = { version = "0.12", features = ["json"], optional = true }
tokio-tungstenite = { version = "0.21", optional = true }
quinn             = { version = "0.11", optional = true }
tonic             = { version = "0.11", optional = true }
prost             = { version = "0.12", optional = true }

[lib]
name = "ling_net"
path = "src/lib.rs"
