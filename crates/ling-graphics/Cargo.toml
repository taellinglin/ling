[package]
name = "ling-graphics"
version = "2030.0.0"
edition = "2024"
authors = ["Ling Lin <taellinglin@gmail.com>", "Sanny Lin <SannyLing53@gmail.com>"]
description = "2D/3D rendering, UI framework, and game engine"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taellinglin/ling"

[features]
default = ["wgpu-backend"]
wgpu-backend = ["dep:wgpu"]
vulkan-backend = ["dep:vulkano"]
metal-backend = ["dep:metal"]
dx12-backend = ["dep:d3d12"]
game-engine = ["dep:bevy", "dep:avian"]
ui-framework = ["dep:xilem", "dep:taffy"]

[dependencies]
ling-core = { workspace = true }

# GPU & Rendering
wgpu = { workspace = true, optional = true, features = ["webgpu"] }
vulkano = { version = "0.34", optional = true }
metal = { package = "metal-rs", version = "0.10.6", optional = true }
d3d12 = { version = "22.0.0", optional = true }

# Game Engine
bevy = { workspace = true, optional = true, features = ["dynamic_linking", "multi_threaded"] }
avian = { version = "0.0.0", optional = true }  # scaffolding
heron = { version = "0.2", optional = true }  # 2D physics

# 3D Rendering
rend3 = { version = "0.3.0", optional = true }
kajiya = { version = "0.0.0", optional = true }
# meshlet = { version = "0.0.0", optional = true }

# UI Framework
xilem = { version = "0.1", optional = true }
taffy = { version = "0.5", optional = true }
druid = { version = "0.8", optional = true }

# Windowing
winit = "0.30"
raw-window-handle = "0.6"

# Utilities
image = "0.24"
fontdue = "0.7"

[dev-dependencies]
criterion = "0.5"

[lib]
name = "ling_graphics"
path = "src/lib.rs"