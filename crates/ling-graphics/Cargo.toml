[package]
name = "ling-graphics"
version = "2030.0.8"
edition = "2021"
authors = ["Ling Lin <taellinglin@gmail.com>", "Sanny Lin <SannyLing53@gmail.com>"]
description = "3D/4D rendering, geometry, animation, and font tools for the Ling ecosystem"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/taellinglin/ling"

[dependencies]
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
fontdue = "0.9"
ttf-parser = "0.21"

[lib]
name = "ling_graphics"
path = "src/lib.rs"
