[package]
name = "ling-user"
version = "2030.1.1"
edition = "2021"
authors = ["vinceswu"]
description = "Userland runtime for Ling programs on LingOS"
license = "Apache-2.0 OR MIT"

[lib]
name = "ling_user"
crate-type = ["rlib"]
# no_std freestanding runtime: a `cargo test` lib target would link std and
# collide with this crate's own `panic` handler (E0152 duplicate lang item)
test = false
doctest = false

[dependencies]
